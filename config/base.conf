{
  "exceptionHandlerLogTarget": "none",
  "serilog": false,
  "disableEng": true,
  "listen": {
    "ip": "any",
    "version": true,
    "ResponseCancelAfter": 10
  },
  "LampaWeb": {
    "initPlugins": {
      "pirate_store": true,
      "jacred": true,
      "jackett": true,
      "tmdbProxy": true,
      "cubProxy": true,
      "online": true,
      "onlineCompact": true,
      "playerLandscape": true,
      "vietnamese": true,
      "subsenseAuto": false,
      "sisi": true,
      "torrserver": true,
      "timecode": true,
      "subsense": false,
      "subfinder": false,
      "stremiosub": true,
      "adminpanel": true,
      "gst": true
    }
  },
  "Jackett": {
    "enable": true,
    "url": "",
    "port": 9117,
    "api_key": "",
    "proxy_downloads": true
  },
  "gst": {
    "enable": true
  },
  "TorrServer": {
    "enable": true,
    "tsport": 9085,
    "defaultPasswd": "ts",
    "releases": "MatriX.135"
  },
  "PidTor": {
    "enable": true,
    "gst": false,
    "redapi": "http://jac.red",
    "min_sid": 15,
    "emptyVoice": true
  },
  "AIOStreams": {
    "enable": false,
    "manifest": "",
    "streams": true,
    "subtitles": true,
    "streamproxy": true,
    "timeoutSeconds": 30,
    "maxStreams": 100,
    "cacheSeconds": 120
  },
  "SubFinder": {
    "subdl_api_key": "",
    "subsource_api_key": ""
  },
  "BaseModule": {
    "ValidateRequest": false,
    "ValidateIdentity": false,
    "BlockedBots": false,
    "LoadModules": [
      ".*"
    ],
    "SkipModules": [
      "Catalog",
      "Tracks",
      "Transcoding",
      "WebLog",
      "CacheMedia",
      "ForkPlayerXML",
      "MsxNative",
      "Potok",
      "TelegramAuth",
      "TelegramAuthBot"
    ],
    "Middlewares": {
      "staticFiles": true,
      "staticFilesMappings": {
        ".m4s": "video/mp4",
        ".ts": "video/mp2t",
        ".mp4": "video/mp4",
        ".mkv": "video/x-matroska",
        ".m3u": "application/x-mpegURL",
        ".m3u8": "application/vnd.apple.mpegurl",
        ".webm": "video/webm",
        ".m2ts": "video/MP2T"
      }
    }
  },
  "accsdb": {
    "enable": false
  },
  "WAF": {
    "enable": false
  },
  ///////////////////////////////////////////////////////////////////
  // Удалите настройки ниже если сервис использует более 10 человек
  ///////////////////////////////////////////////////////////////////
  "lowMemoryMode": true,
  "pool": {
    "BufferMax": 50000000,          // 50Mb, буфер для proxy
    "BufferValidityMinutes": -1,
    "BufferByteSmallMaxCount": 4,   // 4 cell × 2Mb = 8Mb
    "BufferByteMediumMaxCount": 1,  // 1 cell = 8Mb
    "BufferCharSmallMaxCount": 4,   // 4 cell × 2Mb = 8Mb
    "BufferCharMediumMaxCount": 2,  // 2 cell × 8Mb = 16Mb
    "BufferWriterSmallMaxCount": 5, // 5 cell × 1Mb = 5Mb
    "StringBuilderLargeMaxCount": 2 // 2 × 4Mb = 8Mb
  },
  "serverproxy": {
    // Bắt buộc cho các host sau Cloudflare: player tự fetch bằng UA riêng
    // sẽ bị 403, qua /proxy/ Lampac fetch bằng UA Chrome.
    "enable": true,
    "verifyip": false,
    "image": {
      "cache_time": 60
    }
  }
}
