{
  "listen": {
    "ip": "0.0.0.0",
    "port": 9118,
    "scheme": "http",
    "version": true
  },
  "disableEng": false,
  "gst": {
    "enable": true,
    "hdr_to_sdr": true,
    "useGpu": true,
    "hardwareAcceleration": false,
    "x264Ultrafast": true,
    "segment_seconds": 2,
    "segment_buffer": 4
  },
  "chromium": {
    "enable": true,
    "Headless": true,
    "executablePath": "/usr/bin/google-chrome-stable",
    "Args": [
      "--no-sandbox",
      "--disable-setuid-sandbox",
      "--disable-dev-shm-usage",
      "--disable-gpu"
    ],
    "context": {
      "keepopen": false,
      "min": 0,
      "max": 1
    }
  },
  "LampaWeb": {
    "initPlugins": {
      "sisi": true
    }
  },
  "hochutv": {
    "enable": true
  }
}
