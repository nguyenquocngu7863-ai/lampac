---
listen:
  version: true
  ip: 0.0.0.0
  port: 9118
  scheme: http
  localhost: 127.0.0.1
BaseModule:
  SkipModules:
    - Catalog
    - DLNA
    - JacRed
    - Sync
    - TimeCode
    - Tracks
    - Transcoding
    - WebLog
chromium:
  enable: true
  executablePath: "/usr/bin/chromium"
gst:
  enable: true
  hdr_to_sdr: true
  useGpu: true
  hardwareAcceleration: false
  x264Ultrafast: true
  segment_seconds: 2
  segment_buffer: 4
TorrServer:
  enable: true
  tsport: 9085
  defaultPasswd: ts
  releases: MatriX.135
PidTor:
  enable: true
  gst: false
  redapi: http://jac.red
  min_sid: 15
  emptyVoice: true
openstat:
  enable: true
online:
  name: Lampac NextGen
  spiderName: Lampac NextGen
  version: true
  btn_priority_forced: true
sisi:
  lgbt: false
  spider: false
  NextHUB: true
  history:
    enable: false
