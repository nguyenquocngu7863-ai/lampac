<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card</title>
<style>
/* ===== BASE CSS copied from Online/plugin.js (stock rectangle CSS) ===== */
body { background:#14161a; color:#fff; font-family: Arial, sans-serif; margin:0; padding:1em; }
.online-prestige {
  position: relative;
  border-radius: 0.3em;
  background-color: rgba(0, 0, 0, 0.3);
  display: flex;
}
.online-prestige__body { padding: 1.2em; line-height: 1.3; flex-grow: 1; position: relative; }
@media screen and (max-width: 480px) { .online-prestige__body { padding: 0.8em 1.2em; } }
.online-prestige__img { position: relative; width: 13em; flex-shrink: 0; min-height: 8.2em; }
.online-prestige__img > img {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover; border-radius: 0.3em; opacity: 1; transition: opacity .3s;
}
@media screen and (max-width: 480px) { .online-prestige__img { width: 7em; min-height: 6em; } }
.online-prestige__head, .online-prestige__footer { display:flex; justify-content:space-between; align-items:center; }
.online-prestige__timeline { margin: 0.8em 0; }
.online-prestige__title { font-size: 1.7em; overflow: hidden; text-overflow: ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }
@media screen and (max-width: 480px) { .online-prestige__title { font-size: 1.4em; } }
.online-prestige__time { padding-left: 2em; }
.online-prestige__info { display:flex; align-items:flex-start; flex-wrap:wrap; }
.online-prestige__quality { padding-left: 1em; white-space: nowrap; }
.online-prestige + .online-prestige { margin-top: 1.5em; }
.online-prestige-split { font-size:.8em; margin:0 1em; flex-shrink:0; }
.measure { font-size:13px; margin:.3em 0 1em; font-weight:bold; }
</style>
</head>
<body>
<div class="measure" id="m">đang đo…</div>

<div class="online-prestige online-prestige--full selector">
  <div class="online-prestige__img online-prestige__img--loaded">
    <img alt="" src="poster.jpg">
  </div>
  <div class="online-prestige__body">
    <div class="online-prestige__head">
      <div class="online-prestige__title">Phim Test Poster Vuông</div>
      <div class="online-prestige__time">02:14:00</div>
    </div>
    <div class="online-prestige__timeline"></div>
    <div class="online-prestige__footer">
      <div class="online-prestige__info">Lồng tiếng<span class="online-prestige-split">●</span>1080p</div>
      <div class="online-prestige__quality">4K</div>
    </div>
  </div>
</div>

<div class="online-prestige online-prestige--full selector">
  <div class="online-prestige__img online-prestige__img--loaded">
    <img alt="" src="poster.jpg">
  </div>
  <div class="online-prestige__body">
    <div class="online-prestige__head">
      <div class="online-prestige__title">Tập 2 — tên tập rất dài để kiểm tra xuống dòng trên màn hình nhỏ</div>
      <div class="online-prestige__time">45:00</div>
    </div>
    <div class="online-prestige__timeline"></div>
    <div class="online-prestige__footer">
      <div class="online-prestige__info">Vietsub<span class="online-prestige-split">●</span>720p</div>
      <div class="online-prestige__quality">HD</div>
    </div>
  </div>
</div>

<script>
window.Lampa = {
  Storage: { get: function () { return 'true'; }, listener: null },
  SettingsApi: null
};
</script>
<script src="online-compact.js?cb=2"></script>
<script>
function report() {
  var img = document.querySelector('.online-prestige__img');
  var r = img.getBoundingClientRect();
  var portrait = window.matchMedia('(orientation: portrait)').matches;
  var square = Math.abs(r.width - r.height) < 1.5;
  var el = document.getElementById('m');
  var mode = portrait ? 'DỌC' : 'NGANG';
  var expect = portrait ? square : !square; // portrait must be square, landscape must stay stock
  el.textContent = mode + ' — poster ' + r.width.toFixed(0) + 'x' + r.height.toFixed(0) + 'px — ' +
    (portrait
      ? (square ? '✅ VUÔNG (đúng)' : '❌ CHƯA VUÔNG (sai)')
      : (!square ? '✅ giữ nguyên gốc (đúng)' : 'vuông'));
  el.style.color = expect ? '#6f6' : '#f66';
}
window.addEventListener('resize', function(){ setTimeout(report, 100); });
setTimeout(report, 400);
</script>
</body>
</html>
