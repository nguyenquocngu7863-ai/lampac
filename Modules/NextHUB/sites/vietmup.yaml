search:
  uri: /search?q={search}

contentParse:
  eval: |
    foreach (var block in Regex.Split(html, "<div class=\"group\">").Skip(1))
    {
      string slug = Regex.Match(block, "^<a href=\"/watch/([A-Za-z0-9_\\-\\.]+)\"").Groups[1].Value;
      if (string.IsNullOrEmpty(slug)) continue;
      string pic = Regex.Match(block, "src=\"(https://cdn\\.vietmup\\.pro/[^\"]+)\"").Groups[1].Value;
      string name = Regex.Match(block, "alt=\"([^\"]+)\"").Groups[1].Value;
      if (string.IsNullOrEmpty(name)) continue;
      playlists.Add(new PlaylistItem()
      {
        name = name,
        video = "nexthub/vidosik?uri=" + Shared.Services.Utilities.AesTo.Encrypt($"{plugin}_-:-_{init.host}/watch/{slug}"),
        picture = pic,
        json = true,
        bookmark = new Shared.Models.SISI.Base.Bookmark() { site = "vietmup", href = slug, image = pic }
      });
    }
    if (playlists.Count == 0)
    {
      string clean = html.Replace("\\\\\"", "\"");
      var parts = Regex.Split(clean, "\\\\?\"href\\\\?\":\\\\?\"/watch/");
      foreach (var part in parts.Skip(1))
      {
        string slug = Regex.Match(part, "^([A-Za-z0-9_\\-\\.]+)").Groups[1].Value;
        if (string.IsNullOrEmpty(slug)) continue;
        string pic = Regex.Match(part, "\\\\?\"src\\\\?\":\\\\?\"(https://cdn\\.vietmup\\.pro/[^\"\\\\]+)").Groups[1].Value;
        pic = pic.Replace("\\/", "/");
        string name = Regex.Match(part, "\\\\?\"alt\\\\?\":\\\\?\"([^\"\\\\]+)").Groups[1].Value;
        name = Regex.Replace(name, "\\\\u([0-9a-fA-F]{4})", m => ((char)Convert.ToInt32(m.Groups[1].Value, 16)).ToString());
        name = Regex.Unescape(name);
        name = name.Replace("\\/", "/");
        if (string.IsNullOrEmpty(name)) continue;
        playlists.Add(new PlaylistItem()
        {
          name = name,
          video = "nexthub/vidosik?uri=" + Shared.Services.Utilities.AesTo.Encrypt($"{plugin}_-:-_{init.host}/watch/{slug}"),
          picture = pic,
          json = true,
          bookmark = new Shared.Models.SISI.Base.Bookmark() { site = "vietmup", href = slug, image = pic }
        });
      }
    }
    return playlists;

view:
  viewsource: true
  eval: |
    // Trang có 2 token: type "m3u8" (segment trần PNG-bọc-TS, player dùng)
    // và type "hls" (AES-128, key trả trang quảng cáo -> chết). Lấy m3u8 trước.
    var h = Regex.Match(html, "data-server-type=\"m3u8\" data-server-url=\"([^\"]+)\"");
    if (!h.Success)
        h = Regex.Match(html, "data-server-type=\"hls\" data-server-url=\"([^\"]+)\"");
    if (h.Success)
    {
      string u = h.Groups[1].Value;
      return u.StartsWith("http") ? u : init.host + u;
    }
    var m = Regex.Match(html, "https://cdn\\.vietmup\\.pro/m3u8/[^\"\\\\ ]+\\.m3u8");
    if (m.Success) return m.Value;
    var m2 = Regex.Match(html, "https://[^\"]+\\.m3u8");
    if (m2.Success) return m2.Value;
    return null;
