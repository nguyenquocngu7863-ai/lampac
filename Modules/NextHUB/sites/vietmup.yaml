route:
  eval: |
    if (!string.IsNullOrEmpty(search))
      return $"{host}/search?q={HttpUtility.UrlEncode(search)}" + (page > 1 ? $"&page={page}" : "");
    string q = cat ?? "";
    string s = !string.IsNullOrEmpty(sort) ? sort : "";
    string basePath = string.IsNullOrEmpty(q) ? "/" : $"/category/{q}";
    string qs = "";
    if (page > 1) qs += $"page={page}";
    if (!string.IsNullOrEmpty(s)) qs += (qs == "" ? "" : "&") + $"sort={s}";
    if (qs != "") qs = "?" + qs;
    return $"{host}{basePath}{qs}";

list:
  uri: /

search:
  uri: /search?q={search}

contentParse:
  eval: |
    string clean = html.Replace("\\\\\"", "\"");
    var parts = Regex.Split(clean, "\\\\?\"href\\\\?\":\\\\?\"/watch/");
    foreach (var part in parts.Skip(1))
    {
      string slug = Regex.Match(part, "^([A-Za-z0-9_\\-\\.]+)").Groups[1].Value;
      if (string.IsNullOrEmpty(slug)) continue;
      string pic = Regex.Match(part, "\\\\?\"src\\\\?\":\\\\?\"(https://cdn\\.vietmup\\.pro/[^\"\\\\]+)").Groups[1].Value;
      pic = pic.Replace("\\/", "/");
      string name = Regex.Match(part, "\\\\?\"alt\\\\?\":\\\\?\"([^\"\\\\]+)").Groups[1].Value;
      name = Regex.Replace(name, "\\\\u([0-9a-fA-F]{4})", m => ((char)Convert.ToInt32(m.Groups[1].Value, 16)).ToString());
      name = Regex.Unescape(name);
      name = name.Replace("\\/", "/");
      if (string.IsNullOrEmpty(name)) continue;
      playlists.Add(new PlaylistItem()
      {
        name = name,
        video = "nexthub/vidosik?uri=" + Shared.Services.Utilities.AesTo.Encrypt($"{plugin}_-:-_{init.host}/watch/{slug}"),
        picture = pic,
        json = true
      });
    }
    return playlists;

view:
  viewsource: true
  eval: |
    var m = Regex.Match(html, "https://cdn\\.vietmup\\.pro/m3u8/[^\"\\\\ ]+\\.m3u8");
    if (m.Success) return m.Value;
    var m2 = Regex.Match(html, "https://[^\"]+\\.m3u8");
    if (m2.Success) return m2.Value;
    return null;
