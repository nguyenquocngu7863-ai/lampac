list:
  uri: "video?page={page}"

search:
  uri: "video/search?search={search}&page={page}"

contentParse:
  nodes: //li[contains(@class,'videoblock')] | //div[contains(@class,'video-list') or contains(@class,'videos')]//li[contains(@class,'videoblock')] | //ul[@id='videoCategory']//li[contains(@class,'videoblock')]
  name:
    node: .//a[@data-event='thumb_click'] | .//a
    attribute: title
  href:
    node: .//a[contains(@class,'linkVideoThumb')] | .//a[contains(@class,'title')]
    attribute: href
  img:
    node: .//img | .//a[contains(@class,'linkVideoThumb')]//img
    attributes: ["data-mediumthumb", "data-thumb_url", "data-image", "src"]
  preview:
    node: .//img | .//a[contains(@class,'linkVideoThumb')]//img
    attribute: data-mediabook
  duration:
    node: .//var[contains(@class,'duration')] | .//*[contains(@class,'duration')]
  model:
    name:
      node: .//a[contains(@href,'/pornstar/')]
    href:
      node: .//a[contains(@href,'/pornstar/')]
      attribute: href

view:
