search:
  uri: search/{search}/{page}/

contentParse:
  nodes: //div[contains(@class,'item ')]
  name:
    node: .//strong
  href:
    node: .//a
    attribute: href
  img:
    node: .//img
    attribute: data-webp
  duration:
    node: .//div[@class='duration']
  preview:
    node: .//img
    attribute: data-preview

view:
  related: true
  viewsource: true
  regexMatch:
    matches: ["Best Quality"]
    pattern: "video_alt_url: '([^']+)'"
    format: "{value}"
