route:
  eval: |
    string q = !string.IsNullOrEmpty(search) ? search : cat;
    string qs = !string.IsNullOrEmpty(q) ? $"&search={HttpUtility.UrlEncode(q)}" : "";
    string s = !string.IsNullOrEmpty(sort) ? sort : "-publishedAt";
    return $"{host}/api/v1/videos?start={(page - 1) * 12}&count=12&sort={s}{qs}";

list:
  uri: api/v1/videos?start=0&count=12&sort=-publishedAt

search:
  uri: api/v1/videos?start=0&count=12&sort=-publishedAt&search={search}

contentParse:
  eval: |
    var parts = Regex.Split(html, "\"uuid\":\"");
    foreach (var part in parts.Skip(1))
    {
      string uuid = Regex.Match(part, "^([^\"]+)").Groups[1].Value;
      if (string.IsNullOrEmpty(uuid)) continue;
      string name = Regex.Match(part, "\"name\":\"((?:[^\"\\\\]|\\\\.)*)\"").Groups[1].Value;
      name = Regex.Replace(name, "\\\\u([0-9a-fA-F]{4})", m => ((char)Convert.ToInt32(m.Groups[1].Value, 16)).ToString());
      name = Regex.Unescape(name);
      if (string.IsNullOrEmpty(name)) continue;
      int d = 0;
      var dm = Regex.Match(part, "\"duration\":(\\d+)");
      if (dm.Success) d = int.Parse(dm.Groups[1].Value);
      string pic = Regex.Match(part, "\"fileUrl\":\"([^\"]+)\"").Groups[1].Value;
      if (string.IsNullOrEmpty(pic))
      {
        string tp = Regex.Match(part, "\"thumbnailPath\":\"([^\"]+)\"").Groups[1].Value;
        if (!string.IsNullOrEmpty(tp)) pic = init.host + tp;
      }
      playlists.Add(new PlaylistItem()
      {
        name = name,
        video = "nexthub/vidosik?uri=" + Shared.Services.Utilities.AesTo.Encrypt($"{plugin}_-:-_{init.host}/api/v1/videos/{uuid}"),
        picture = pic,
        time = $"{d / 60:D2}:{d % 60:D2}",
        json = true
      });
    }
    return playlists;

view:
  viewsource: true
  eval: |
    var j = JObject.Parse(html);
    var files = j["files"] as JArray;
    if (files != null)
    {
      string best = null;
      int bestRes = -1;
      foreach (var f in files)
      {
        var res = f["resolution"];
        string label = res != null ? (string)res["label"] : null;
        if (label != null && label.Contains("Audio")) continue;
        string furl = (string)f["fileUrl"];
        if (string.IsNullOrEmpty(furl)) continue;
        int rid = 0;
        try { rid = res != null && res["id"] != null ? (int)res["id"] : 0; } catch { rid = 0; }
        if (rid >= bestRes) { bestRes = rid; best = furl; }
      }
      if (best != null) return best;
    }
    return null;
