# CAM4 là directory cam LIVE: mỗi đường dẫn (/female, /female/teen, /male, ...)
# chỉ được server render MỘT tốp model (~vài chục). Tham số ?page=N chỉ có tác
# dụng trong app React phía trình duyệt — request HTTP thuần (cách NextHUB tải
# trang, priorityBrowser: http) luôn nhận cùng một danh sách, nên trang 2, 3...
# trả về đúng nội dung trang 1 => Lampa cộng dồn thành "lặp lại vô hạn".
# Vì vậy: total_pages: 1 (tắt phân trang ảo) và mở rộng "categories" để mỗi
# mục là MỘT ĐƯỜNG DẪN thật (mỗi path = một dàn model khác nhau).
# Muốn kiểm tra mạng của bạn có được CAM4 phân trang thật hay không:
#   curl -s "https://www.cam4.com/female?page=1" | grep -o '"username":"[^"]*"' | head -5
#   curl -s "https://www.cam4.com/female?page=2" | grep -o '"username":"[^"]*"' | head -5
# Hai danh sách KHÁC nhau => server có phân trang; khi đó có thể tăng
# total_pages (vd 10) — route bên dưới đã sẵn ?page={page}.
