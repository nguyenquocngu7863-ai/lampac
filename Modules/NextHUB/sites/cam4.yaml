contentParse:
  eval: |
    var seen = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
    var match = Regex.Match(html, "\"username\":\"([^\"]+)\".*?\"src\":\"([^\"]+)\".*?\"poster\":\"([^\"]+)\"");
    while(match.Success){
      string username = match.Groups[1].Value;
      if (seen.Add(username))
      {
        playlists.Add(new PlaylistItem(){
          name = username,
          video = match.Groups[2].Value.Replace("\\u002F", "/"),
          picture = match.Groups[3].Value.Replace("\\u002F", "/")
        });
      }
      match = match.NextMatch();
    }
    return playlists;
