contentParse:
  eval: |
    var match = Regex.Match(html, "\"username\":\"([^\"]+)\".*?\"src\":\"([^\"]+)\".*?\"poster\":\"([^\"]+)\"");
    while(match.Success){
      playlists.Add(new PlaylistItem(){
        name =  match.Groups[1].Value,
        video = match.Groups[2].Value.Replace("\\u002F", "/"),
        picture = match.Groups[3].Value.Replace("\\u002F", "/")
