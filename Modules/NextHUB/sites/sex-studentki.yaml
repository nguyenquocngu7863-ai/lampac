    if (pl.model != null){
      string model = Regex.Match(pl.model.uri, "%d0%bb%d1%8c%2f([^%]+)").Groups[1].Value;
      pl.model = string.IsNullOrEmpty(model) ? null : new ModelItem(pl.model.name, $"nexthub?plugin={plugin}&model={model}");
