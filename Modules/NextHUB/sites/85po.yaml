    Có lông: duo-mao
    Trên giường: chuang-shang
    Gợi cảm: sao

list:
  firstpage: latest-updates/
  uri: latest-updates/{page}/

search:
  uri: search/{search}/{page}/

contentParse:
  nodes: //div[contains(concat(' ', normalize-space(@class), ' '), ' item ')]
  name:
    node: .//a
    attribute: title
  href:
    node: .//a[contains(@href, '/v/')]
    attribute: href
  img:
    node: .//img
    attributes: ["data-original", "data-src", "src"]
  duration:
    node: .//*[contains(@class, 'duration')]

view:
  related: true
  bindingToIP: true
  viewsource: true
  eval: |
    string link = null;
    foreach (string q in new string[] { "alt_url5", "alt_url4", "alt_url3", "alt_url2", "alt_url", "url" })
    {
        string l = Regex.Match(html, $"video_{q}:[\\t ]+'([^']+)'", RegexOptions.IgnoreCase).Groups[1].Value;
        if (!string.IsNullOrEmpty(l) && l.Contains("/get_file/"))
        {
            link = l;
            break;
        }
    }
    if (string.IsNullOrEmpty(link))
    {
        foreach (string q in new string[] { "1080p", "720p", "480p", "360p" })
        {
            link = Regex.Match(html, $"(https?://[^/]+/get_file/[^\"]+_{q}\\.mp4([^\"]+)?)", RegexOptions.IgnoreCase).Groups[1].Value;
            if (!string.IsNullOrEmpty(link))
                break;
        }
    }
    if (string.IsNullOrEmpty(link))
        link = Regex.Match(html, "(https?://[^/]+/get_file/[^'\"]+\\.mp4)", RegexOptions.IgnoreCase).Groups[1].Value;
    if (string.IsNullOrEmpty(link))
        return null;
    link = link.Replace("&amp;", "&").Replace("function/0/", "");
    string location = await Http.GetLocation(link, referer: url);
    if (string.IsNullOrEmpty(location) || location == link)
        return link;
    if (location.StartsWith("//"))
        location = "https:" + location;
    if (!Uri.TryCreate(location, UriKind.Absolute, out Uri abs) &&
        !Uri.TryCreate(new Uri(link), location, out abs))
        return link;
    return abs.AbsoluteUri;
