enable: true
displayindex: 6
displayname: 85PO
rch_access: apk,cors
stream_access: apk,cors
host: https://www.85po.com
priorityBrowser: chrome
streamproxy: true
headers_stream:
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36"
  referer: "{host}/"
  accept: "*/*"

menu:
  sort:
    Mới nhất: ""
    Phổ biến: most-popular/{page}/
    Đánh giá cao: top-rated/{page}/
  categories:
    format: tags/{cat}/{page}/
    Tự quay: zi-pai
    Đài Loan: tai-wan
    Nhật Bản: ri-ben
    Cặp đôi: qing-lv
    Khẩu giao: kou-jiao
    Ngực lớn: ju-ru
    Ngực to: da-nai
    Mông đẹp: mei-tun
    Thủ dâm: zi-wei
    Squirt: pen-shui
    Quan hệ: zuo-ai
    Cởi đồ: tuo-yi
    Khỏa thân: quan-luo
    Đồ lót: nei-yi2
    Có lông: duo-mao
    Trên giường: chuang-shang
    Gợi cảm: sao

list:
  firstpage: latest-updates/
  uri: latest-updates/{page}/

search:
  uri: search/{search}/{page}/

contentParse:
  nodes: //div[contains(concat(' ', normalize-space(@class), ' '), ' item ')]
  name:
    node: .//a
    attribute: title
  href:
    node: .//a[contains(@href, '/v/')]
    attribute: href
  img:
    node: .//img
    attributes: ["data-original", "data-src", "src"]
  duration:
    node: .//*[contains(@class, 'duration')]

view:
  related: true
  bindingToIP: true
  # patternFile intercepts the REAL video URL after KVS JavaScript computes
  # the correct hash. Without this, we only get the raw URL from HTML source
  # which has a placeholder hash that KVS CDN rejects.
  patternFile: "get_file.*\\.mp4"
  playbtn: ".player_area, .play-btn, video, .btn-player"
