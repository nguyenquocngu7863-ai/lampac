list:
  firstpage: latest-updates/
  uri: latest-updates/{page}/

search:
  uri: search/{search}/{page}/

contentParse:
  nodes: //div[contains(concat(' ', normalize-space(@class), ' '), ' item ')]
  name:
    node: .//a
    attribute: title
  href:
    node: .//a[contains(@href, '/v/')]
    attribute: href
  img:
    node: .//img
    attributes: ["data-original", "data-src", "src"]
  duration:
    node: .//*[contains(@class, 'duration')]

view:
  related: true
  bindingToIP: true
  viewsource: true
  eval: |
    string link = null;
    foreach (string q in new string[] { "_1080p", "_720p", "_480p", "_360p" })
    {
        link = Regex.Match(html, $"(https?://[^/]+/get_file/[^'\"\\s]+{q}\\.mp4[^'\"\\s]*)", RegexOptions.IgnoreCase).Groups[1].Value;
        if (!string.IsNullOrEmpty(link))
            break;
    }
    if (string.IsNullOrEmpty(link))
    {
        foreach (string q in new string[] { "alt_url5", "alt_url4", "alt_url3", "alt_url2", "alt_url", "url" })
        {
            string l = Regex.Match(html, $"video_{q}:\\s*'([^']+)'", RegexOptions.IgnoreCase).Groups[1].Value;
            if (!string.IsNullOrEmpty(l) && l.Contains("/get_file/"))
            {
                link = l;
                break;
            }
        }
    }
    if (string.IsNullOrEmpty(link))
        link = Regex.Match(html, "(https?://[^/]+/get_file/[^'\"\\s]+\\.mp4[^'\"\\s]*)", RegexOptions.IgnoreCase).Groups[1].Value;
    if (string.IsNullOrEmpty(link))
        return null;
    link = link.Replace("&amp;", "&").Replace("function/0/", "");
    // 85po khóa link theo IP — trả về link gốc để ViewController proxy qua /nexthub/strem.mp4 (bindingToIP + streamproxy)
    return link;
