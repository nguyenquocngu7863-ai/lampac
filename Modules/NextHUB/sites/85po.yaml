menu:
  sort:
    Mới nhất: ""
    Phổ biến: most-popular/{page}/
    Đánh giá cao: top-rated/{page}/
  categories:
    format: tags/{cat}/{page}/
    Tự quay: zi-pai
    Đài Loan: tai-wan
    Nhật Bản: ri-ben
    Cặp đôi: qing-lv
    Khẩu giao: kou-jiao
    Ngực lớn: ju-ru
