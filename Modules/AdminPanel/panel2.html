<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel gọn</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
#side { width: 280px; min-width: 280px; border-right: 1px solid #8884; overflow-y: auto; padding: 10px; }
#main { flex: 1; overflow-y: auto; padding: 16px; max-width: 900px; }
#q { width: 100%; padding: 8px; margin-bottom: 8px; font-size: 15px; }
.grp { font-weight: bold; margin: 10px 0 4px; font-size: 13px; opacity: .7; }
.mod { display: block; width: 100%; text-align: left; padding: 7px 9px; margin: 1px 0; border: 0; border-radius: 6px; background: none; cursor: pointer; font-size: 14px; }
.mod:hover { background: #8882; }
.mod.on { background: #4a90d955; }
.mod .dot { float: right; }
.row { display: flex; gap: 8px; align-items: flex-start; margin: 7px 0; }
.row label { width: 220px; min-width: 220px; padding-top: 7px; font-size: 13px; word-break: break-word; }
.row input[type=text], .row input[type=number], .row textarea { flex: 1; padding: 7px; font-size: 14px; font-family: monospace; }
.row textarea { min-height: 60px; resize: vertical; }
.row input[type=checkbox] { width: 20px; height: 20px; margin-top: 7px; }
.bar { position: sticky; top: 0; padding: 10px 0; display: flex; gap: 8px; align-items: center; }
button.big { padding: 9px 18px; font-size: 15px; cursor: pointer; }
#msg { padding: 8px; }
.hint { font-size: 12px; opacity: .65; }
.hide { display: none; }
</style>
</head>
<body>
<div id="side">
  <input id="q" type="text" placeholder="Tìm module / key..." autocomplete="off">
  <div id="mods"></div>
</div>
<div id="main">
  <div class="bar">
    <button class="big" id="btnSave">Lưu mục này</button>
    <button class="big" id="btnRestart">Restart lampac</button>
    <span id="msg"></span>
  </div>
  <div class="hint">Lưu chỉ ghi đúng mục đang mở vào init.conf (không phình file). Đổi config cần restart mới ăn. Bấm Lưu xong bấm Restart.</div>
  <h2 id="title">Chọn module bên trái</h2>
  <div id="ed"></div>
</div>
<script>
(function () {
  'use strict';
  var current = {};
  var catalog = [];
  var curKey = '';
  var inputs = {};

  function msg(t, bad) {
    var m = document.getElementById('msg');
    m.textContent = t;
    m.style.color = bad ? 'red' : 'green';
  }

  function isObj(v) { return v && typeof v === 'object'; }

  function enableOf(sec) {
    if (!isObj(sec)) return null;
    if (typeof sec.enable === 'boolean') return 'enable';
    if (typeof sec.enabled === 'boolean') return 'enabled';
    return null;
  }

  function load() {
    Promise.all([
      fetch('api/current', { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
      fetch('api/groups/catalog', { credentials: 'same-origin' }).then(function (r) { return r.json(); })
    ]).then(function (res) {
      current = res[0] || {};
      catalog = res[1] || [];
      renderSide('');
    }).catch(function () { msg('Không tải được config (chưa đăng nhập?)', true); });
  }

  function allKeys() {
    var set = {};
    catalog.forEach(function (g) { (g.keys || []).forEach(function (k) { set[k] = g.title || g.id; }); });
    Object.keys(current).forEach(function (k) { if (!set[k]) set[k] = 'Khác'; });
    return set;
  }

  function renderSide(f) {
    f = (f || '').toLowerCase();
    var map = allKeys();
    var keys = Object.keys(map).sort();
    var box = document.getElementById('mods');
    box.innerHTML = '';
    var lastGrp = '';
    keys.forEach(function (k) {
      var sec = current[k];
      var blob = (k + ' ' + JSON.stringify(sec)).toLowerCase();
      if (f && blob.indexOf(f) === -1) return;
      var g = map[k];
      if (g !== lastGrp) {
        lastGrp = g;
        var gd = document.createElement('div');
        gd.className = 'grp';
        gd.textContent = g;
        box.appendChild(gd);
      }
      var b = document.createElement('button');
      b.className = 'mod' + (k === curKey ? ' on' : '');
      var en = enableOf(sec);
      var dot = en ? (sec[en] ? '🟢' : '⚫') : '·';
      b.innerHTML = '<span class="dot">' + dot + '</span><span></span>';
      b.lastChild.textContent = k;
      b.onclick = (function (key) { return function () { open(key); }; })(k);
      box.appendChild(b);
    });
  }

  function field(key, val) {
    var row = document.createElement('div');
    row.className = 'row';
    var lb = document.createElement('label');
    lb.textContent = key;
    row.appendChild(lb);
    var inp;
    if (typeof val === 'boolean') {
      inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = val;
      inp._get = function () { return inp.checked; };
    } else if (typeof val === 'number') {
      inp = document.createElement('input');
      inp.type = 'number';
      inp.step = 'any';
      inp.value = val;
      inp._get = function () { return inp.value === '' ? 0 : Number(inp.value); };
    } else if (typeof val === 'string' && (val.length > 80 || val.indexOf('\n') !== -1)) {
      inp = document.createElement('textarea');
      inp.value = val;
      inp._get = function () { return inp.value; };
    } else if (typeof val === 'string') {
      inp = document.createElement('input');
      inp.type = 'text';
      inp.value = val;
      inp._get = function () { return inp.value; };
    } else if (Array.isArray(val) && val.every(function (x) { return typeof x !== 'object'; })) {
      inp = document.createElement('textarea');
      inp.value = val.join('\n');
      inp._get = function () {
        return inp.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; });
      };
    } else {
      inp = document.createElement('textarea');
      inp.value = JSON.stringify(val, null, 2);
      inp._get = function () { return JSON.parse(inp.value); };
    }
    row.appendChild(inp);
    inputs[key] = inp;
    return row;
  }

  function open(key) {
    curKey = key;
    inputs = {};
    document.getElementById('title').textContent = key;
    var ed = document.getElementById('ed');
    ed.innerHTML = '';
    var sec = current[key];
    if (!isObj(sec)) {
      var p = document.createElement('p');
      p.textContent = 'Mục này là giá trị đơn: ' + JSON.stringify(sec);
      ed.appendChild(p);
      return;
    }
    var keys = Object.keys(sec);
    var en = enableOf(sec);
    if (en) {
      keys = [en].concat(keys.filter(function (k) { return k !== en; }));
    }
    keys.forEach(function (k) { ed.appendChild(field(k, sec[k])); });
    renderSide(document.getElementById('q').value);
    msg('');
  }

  document.getElementById('q').addEventListener('input', function (e) {
    renderSide(e.target.value);
  });

  document.getElementById('btnSave').addEventListener('click', function () {
    if (!curKey) { msg('Chưa chọn module', true); return; }
    var out = {};
    try {
      Object.keys(inputs).forEach(function (k) { out[k] = inputs[k]._get(); });
    } catch (e) {
      msg('JSON hỏng: ' + e.message, true);
      return;
    }
    msg('Đang lưu...');
    fetch('api/init/section/' + encodeURIComponent(curKey), {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(out)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && (j.ok === true || j.status === 'ok' || !j.error)) {
        current[curKey] = out;
        msg('Đã lưu ' + curKey + ' — nhớ Restart');
        renderSide(document.getElementById('q').value);
      } else {
        msg('Lỗi: ' + JSON.stringify(j), true);
      }
    }).catch(function (e) { msg('Lỗi mạng: ' + e.message, true); });
  });

  document.getElementById('btnRestart').addEventListener('click', function () {
    if (!confirm('Restart lampac bây giờ? (mất ~1 phút)')) return;
    msg('Đang restart...');
    fetch('api/restart', { method: 'POST', credentials: 'same-origin' })
      .then(function () { msg('Đã gửi lệnh restart — đợi 1 phút rồi load lại'); })
      .catch(function () { msg('Đã gửi lệnh (server đang tắt để lên lại)'); });
  });

  load();
})();
</script>
</body>
</html>
