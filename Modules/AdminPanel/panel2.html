<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị gọn</title>
<style>
:root {
  --bg: #14161c; --bg2: #1c1f28; --card: #222633; --line: #ffffff14;
  --txt: #e8eaf0; --dim: #9aa0b4; --acc: #4a90d9; --ok: #3ecf6e; --bad: #ff5d5d;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--txt); font-family: system-ui, -apple-system, sans-serif;
  background: radial-gradient(1200px 600px at 80% -10%, #2b3a5e55, transparent),
              radial-gradient(900px 500px at 10% 110%, #3a2b5e44, transparent), var(--bg);
  background-attachment: fixed; display: flex; flex-direction: column;
}
header {
  display: flex; gap: 10px; align-items: center; padding: 12px 16px;
  background: #ffffff08; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px);
}
header h1 { font-size: 17px; margin: 0 8px 0 0; white-space: nowrap; }
#q { flex: 1; padding: 9px 12px; font-size: 15px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg2); color: var(--txt); min-width: 60px; }
button { cursor: pointer; border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--txt); padding: 9px 14px; font-size: 14px; }
button.pri { background: var(--acc); border-color: transparent; color: #fff; font-weight: bold; }
button:disabled { opacity: .5; }
#wrap { display: flex; flex: 1; min-height: 0; }
#side { width: 250px; min-width: 250px; overflow-y: auto; padding: 10px; border-right: 1px solid var(--line); }
#main { flex: 1; overflow-y: auto; padding: 16px; }
.grp { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 12px 4px 6px; }
.mod { display: flex; justify-content: space-between; align-items: center; width: 100%;
  text-align: left; margin: 2px 0; font-size: 14px; }
.mod.on { background: #4a90d944; border-color: var(--acc); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 12px; }
.card h2 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.card .sub { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
.f { display: grid; grid-template-columns: 200px 1fr; gap: 4px 10px; align-items: center;
  padding: 7px 0; border-top: 1px solid var(--line); }
.f:first-of-type { border-top: 0; }
.f label { font-size: 13px; color: var(--dim); word-break: break-word; }
.f input[type=text], .f input[type=number], .f textarea, .f select {
  width: 100%; padding: 8px 10px; font-size: 14px; font-family: ui-monospace, monospace;
  border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--txt); }
.f textarea { resize: vertical; }
.f input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--acc); }
.actions { display: flex; gap: 8px; margin-top: 12px; }
#msg { padding: 10px 16px; font-size: 14px; min-height: 20px; }
.ok { color: var(--ok); } .err { color: var(--bad); }
.empty { color: var(--dim); padding: 30px; text-align: center; }
@media (max-width: 700px) {
  #side { display: none; }
  #side.mob { display: block; position: fixed; inset: 0; z-index: 10; background: var(--bg); }
  .f { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Quản trị gọn</h1>
  <input id="q" type="text" placeholder="Tìm module / key / giá trị..." autocomplete="off">
  <button id="btnMenu">☰</button>
  <button id="btnRestart">Restart</button>
  <button id="btnClose" class="hide">✕</button>
</header>
<div id="wrap">
  <div id="side"></div>
  <div id="main"><div class="empty">Chọn module bên trái để sửa.<br>Lưu chỉ ghi đúng mục đang mở — không phình init.conf.</div></div>
</div>
<div id="msg"></div>
<script>
(function () {
  'use strict';
  var IN_APP = false;
  try { IN_APP = window.parent && window.parent !== window && !!window.parent.Lampa; } catch (e) {}

  var current = {}, catalog = [], curKey = '';
  var $ = function (id) { return document.getElementById(id); };

  function pw() { try { return sessionStorage.getItem('padm') || ''; } catch (e) { return ''; } }
  function setPw(v) { try { sessionStorage.setItem('padm', v); } catch (e) {} }

  function msg(t, bad) {
    var m = $('msg');
    m.textContent = t;
    m.className = bad ? 'err' : 'ok';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function isObj(v) { return v && typeof v === 'object'; }

  function api(path, method, body, noAuthRetry) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open(method || 'GET', path, true);
      xhr.timeout = 25000;
      var p = pw();
      if (p) xhr.setRequestHeader('X-Root-Passwd', p);
      if (body !== undefined) xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function () {
        var ct = xhr.getResponseHeader('Content-Type') || '';
        if (ct.indexOf('text/html') !== -1) { reject(new Error('auth')); return; }
        var j;
        try { j = JSON.parse(xhr.responseText); }
        catch (e) { reject(new Error('parse')); return; }
        if (j && j.error) { reject(new Error(j.error)); return; }
        resolve(j);
      };
      xhr.onerror = function () { reject(new Error('net')); };
      xhr.ontimeout = function () { reject(new Error('timeout')); };
      xhr.send(body === undefined ? null : JSON.stringify(body));
    }).catch(function (e) {
      if (!noAuthRetry && (e.message === 'auth' || e.message === 'unauthorized')) return askPw().then(function (ok) {
        if (!ok) throw e;
        return api(path, method, body, true);
      });
      throw e;
    });
  }

  function askPw() {
    return new Promise(function (resolve) {
      var v = prompt('Mật khẩu root của lampac:');
      if (!v) { resolve(false); return; }
      var keep = v;
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/adminpanel/api/login', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.timeout = 15000;
      xhr.onload = function () {
        try {
          var j = JSON.parse(xhr.responseText);
          if (j && !j.error && j.ok !== false) { setPw(keep); resolve(true); return; }
        } catch (e) {}
        resolve(false);
      };
      xhr.onerror = function () { resolve(false); };
      xhr.ontimeout = function () { resolve(false); };
      xhr.send(JSON.stringify({ password: v, remember: true }));
    });
  }

  function groupOf(key) {
    for (var i = 0; i < catalog.length; i++) {
      if ((catalog[i].keys || []).indexOf(key) !== -1) return catalog[i].title || catalog[i].id;
    }
    return 'Khác';
  }

  function enableOf(sec) {
    if (!isObj(sec)) return null;
    if (typeof sec.enable === 'boolean') return sec.enable;
    if (typeof sec.enabled === 'boolean') return sec.enabled;
    return null;
  }

  function load() {
    msg('Đang tải...');
    Promise.all([api('/adminpanel/api/current', 'GET'), api('/adminpanel/api/groups/catalog', 'GET')]).then(function (res) {
      current = res[0] || {};
      catalog = res[1] || [];
      msg('');
      renderSide('');
    }).catch(function (e) { msg('Lỗi tải: ' + e.message, true); });
  }

  var sideKeys = [];
  function renderSide(f) {
    f = (f || '').toLowerCase();
    var map = {};
    catalog.forEach(function (g) { (g.keys || []).forEach(function (k) { map[k] = 1; }); });
    Object.keys(current).forEach(function (k) { map[k] = 1; });
    sideKeys = Object.keys(map).sort();
    var box = $('side');
    var html = '';
    var lastG = '';
    sideKeys.forEach(function (k) {
      var sec = current[k];
      if (f && (k + ' ' + JSON.stringify(sec)).toLowerCase().indexOf(f) === -1) return;
      var g = groupOf(k);
      if (g !== lastG) {
        lastG = g;
        html += '<div class="grp">' + esc(g) + '</div>';
      }
      var en = enableOf(sec);
      var dot = en === null ? '' : (en ? '🟢' : '⚫');
      html += '<button class="mod' + (k === curKey ? ' on' : '') + '" data-k="' + esc(k) + '">' +
        '<span>' + esc(k) + '</span><span>' + dot + '</span></button>';
    });
    box.innerHTML = html || '<div class="empty">Không khớp</div>';
    box.querySelectorAll('.mod').forEach(function (b) {
      b.onclick = function () {
        curKey = b.getAttribute('data-k');
        if (window.innerWidth <= 700) box.classList.remove('mob');
        open(curKey);
      };
    });
  }

  function inputFor(key, val) {
    var k = 'data-k="' + esc(key) + '"';
    if (typeof val === 'boolean') {
      return '<input ' + k + ' data-t="b" type="checkbox"' + (val ? ' checked' : '') + '>';
    }
    if (typeof val === 'number') {
      return '<input ' + k + ' data-t="n" type="number" step="any" value="' + esc(val) + '">';
    }
    if (typeof val === 'string') {
      if (val.length > 80 || val.indexOf('\n') !== -1) {
        return '<textarea ' + k + ' data-t="s" rows="3">' + esc(val) + '</textarea>';
      }
      return '<input ' + k + ' data-t="s" type="text" value="' + esc(val) + '">';
    }
    if (Array.isArray(val) && val.every(function (x) { return typeof x !== 'object'; })) {
      return '<textarea ' + k + ' data-t="a" rows="4">' + esc(val.join('\n')) + '</textarea>';
    }
    return '<textarea ' + k + ' data-t="j" rows="6">' + esc(JSON.stringify(val, null, 2)) + '</textarea>';
  }

  function open(key) {
    var sec = current[key];
    if (!isObj(sec)) {
      msg('Đang lấy mẫu ' + key + '...');
      api('/adminpanel/api/sitetpl/' + encodeURIComponent(key), 'GET').then(function (tpl) {
        if (tpl && typeof tpl === 'object' && Object.keys(tpl).length) {
          current[key] = tpl;
          renderCard(key, tpl, true);
          msg('');
        } else {
          renderScalar(key, sec);
          msg('');
        }
      }).catch(function (e) { msg('Lỗi: ' + e.message, true); });
      return;
    }
    renderCard(key, sec, false);
  }

  function renderScalar(key, sec) {
    $('main').innerHTML = '<div class="card"><h2>' + esc(key) + '</h2>' +
      '<div class="sub">Giá trị đơn</div><div><code>' + esc(JSON.stringify(sec)) + '</code></div></div>';
  }

  function renderCard(key, sec, isNew) {
    var keys = Object.keys(sec);
    ['enable', 'enabled'].forEach(function (en) {
      if (typeof sec[en] === 'boolean') keys = [en].concat(keys.filter(function (k) { return k !== en; }));
    });
    var en = enableOf(sec);
    var html = '<div class="card"><h2>' + (en === null ? '' : (en ? '🟢 ' : '⚫ ')) + esc(key) + '</h2>' +
      '<div class="sub">' + esc(groupOf(key)) +
      (isNew ? ' · MỚI từ file yaml — lưu là ghim đè lên yaml' : ' · lưu chỉ ghi mục này') + '</div>';
    keys.forEach(function (k) {
      html += '<div class="f"><label>' + esc(k) + '</label>' + inputFor(k, sec[k]) + '</div>';
    });
    html += '<div class="actions"><button class="pri" id="bSave">Lưu</button>' +
      '<button id="bRe">Lưu + Restart</button></div></div>';
    var main = $('main');
    main.innerHTML = html;
    renderSide($('q').value);
    $('bSave').onclick = function () { save(key, false); };
    $('bRe').onclick = function () { save(key, true); };
  }

  function collect() {
    var out = {};
    document.querySelectorAll('#main [data-k]').forEach(function (el) {
      var t = el.getAttribute('data-t'), k = el.getAttribute('data-k');
      if (t === 'b') out[k] = el.checked;
      else if (t === 'n') out[k] = el.value === '' ? 0 : Number(el.value);
      else if (t === 's') out[k] = el.value;
      else if (t === 'a') {
        out[k] = el.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; });
      }
      else out[k] = JSON.parse(el.value);
    });
    return out;
  }

  function save(key, restart) {
    var out;
    try { out = collect(); }
    catch (e) { msg('JSON hỏng: ' + e.message, true); return; }
    msg('Đang lưu ' + key + '...');
    api('/adminpanel/api/init/section/' + encodeURIComponent(key), 'POST', out).then(function () {
      current[key] = out;
      renderCard(key, out, false);
      if (!restart) { msg('Đã lưu ' + key + ' — nhớ Restart'); return; }
      msg('Đã lưu — đang restart...');
      return api('/adminpanel/api/restart', 'POST', {}).then(function () {
        msg('Đã restart — đợi 1 phút rồi dùng');
      });
    }).catch(function (e) { msg('Lỗi: ' + e.message, true); });
  }

  $('q').addEventListener('input', function (e) { renderSide(e.target.value); });
  $('btnMenu').addEventListener('click', function () { $('side').classList.toggle('mob'); });
  $('btnRestart').addEventListener('click', function () {
    if (!confirm('Restart lampac? (mất ~1 phút)')) return;
    msg('Đang restart...');
    api('/adminpanel/api/restart', 'POST', {}).then(function () {
      msg('Đã restart — đợi 1 phút');
    }).catch(function (e) { msg('Lỗi: ' + e.message, true); });
  });

  if (IN_APP) {
    var bc = $('btnClose');
    bc.classList.remove('hide');
    bc.addEventListener('click', function () {
      try { window.parent.Lampa.Modal.close(); } catch (e) {}
    });
  }

  load();
})();
</script>
</body>
</html>
