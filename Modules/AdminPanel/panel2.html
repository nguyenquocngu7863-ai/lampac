<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị gọn</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: #232838; font-family: system-ui, -apple-system, sans-serif;
  background: linear-gradient(180deg, #eef1f7, #e4e9f2);
  background-attachment: fixed; display: flex; flex-direction: column;
}
header {
  display: flex; gap: 8px; align-items: center; padding: 10px 14px;
  background: #ffffffcc; border-bottom: 1px solid #d5dbe7;
  position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px);
}
header h1 { font-size: 16px; margin: 0 6px 0 0; white-space: nowrap; }
#q { flex: 1; padding: 9px 12px; font-size: 15px; border-radius: 10px;
  border: 1px solid #c9d1e0; background: #fff; color: #232838; min-width: 40px; }
button { cursor: pointer; border: 1px solid #c9d1e0; border-radius: 10px;
  background: #fff; color: #232838; padding: 9px 13px; font-size: 14px; }
button.pri { background: #2f7fe0; border-color: transparent; color: #fff; font-weight: bold; }
#main { flex: 1; overflow-y: auto; padding: 12px 14px 40px; max-width: 1000px; width: 100%; margin: 0 auto; }
.grp { background: #fff; border: 1px solid #d5dbe7; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.grp > summary { padding: 12px 14px; font-weight: bold; font-size: 15px; cursor: pointer;
  list-style: none; display: flex; justify-content: space-between; align-items: center; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary .hint { font-weight: normal; font-size: 12px; color: #7a8398; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px 12px; }
@media (max-width: 700px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { display: flex; justify-content: space-between; align-items: center; gap: 6px;
  padding: 10px; font-size: 13px; text-align: left; border-radius: 10px;
  overflow: hidden; }
.tile span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.on { border-color: #2f7fe0; background: #e8f1fd; }
.back { margin-bottom: 10px; }
.card { background: #fff; border: 1px solid #d5dbe7; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.card h2 { margin: 0 0 4px; font-size: 18px; }
.card .sub { color: #7a8398; font-size: 12px; margin-bottom: 6px; }
.f { display: grid; grid-template-columns: 190px 1fr; gap: 4px 10px; align-items: center;
  padding: 7px 0; border-top: 1px solid #edf0f6; }
.f:first-of-type { border-top: 0; }
.f label { font-size: 13px; color: #5b6376; word-break: break-word; }
.f input[type=text], .f input[type=number], .f textarea {
  width: 100%; padding: 8px 10px; font-size: 14px; font-family: ui-monospace, monospace;
  border-radius: 8px; border: 1px solid #c9d1e0; background: #f7f9fc; color: #232838; }
.f textarea { resize: vertical; }
.f input[type=checkbox] { width: 22px; height: 22px; accent-color: #2f7fe0; }
.actions { display: flex; gap: 8px; margin-top: 12px; }
#msg { padding: 8px 14px; font-size: 14px; min-height: 20px; }
.ok { color: #1d9e52; } .err { color: #d33; }
.empty { color: #7a8398; padding: 30px; text-align: center; }
.hide { display: none; }
@media (max-width: 700px) { .f { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Quản trị</h1>
  <input id="q" type="text" placeholder="Tìm module / key..." autocomplete="off">
  <button id="btnRestart">Restart</button>
  <button id="btnClose" class="hide">✕</button>
</header>
<div id="main"></div>
<div id="msg"></div>
<script>
(function () {
  'use strict';
  var IN_APP = false;
  try { IN_APP = window.parent && window.parent !== window && !!window.parent.Lampa; } catch (e) {}

  var current = {}, catalog = [], curKey = '';
  function $(id) { return document.getElementById(id); }

  function pw() { try { return sessionStorage.getItem('padm') || ''; } catch (e) { return ''; } }
  function setPw(v) { try { sessionStorage.setItem('padm', v); } catch (e) {} }

  function msg(t, bad) {
    var m = $('msg');
    m.textContent = t;
    m.className = bad ? 'err' : 'ok';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function isObj(v) { return v && typeof v === 'object'; }

  function api(path, method, body, noAuthRetry) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open(method || 'GET', path, true);
      xhr.timeout = 25000;
      var p = pw();
      if (p) xhr.setRequestHeader('X-Root-Passwd', p);
      if (body !== undefined) xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function () {
        var ct = xhr.getResponseHeader('Content-Type') || '';
        if (ct.indexOf('text/html') !== -1) { reject(new Error('auth')); return; }
        var j;
        try { j = JSON.parse(xhr.responseText); }
        catch (e) { reject(new Error('parse')); return; }
        if (j && j.error) { reject(new Error(j.error)); return; }
        resolve(j);
      };
      xhr.onerror = function () { reject(new Error('net')); };
      xhr.ontimeout = function () { reject(new Error('timeout')); };
      xhr.send(body === undefined ? null : JSON.stringify(body));
    }).catch(function (e) {
      if (!noAuthRetry && (e.message === 'auth' || e.message === 'unauthorized')) return askPw().then(function (ok) {
        if (!ok) throw e;
        return api(path, method, body, true);
      });
      throw e;
    });
  }

  function askPw() {
    return new Promise(function (resolve) {
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:#0008;display:flex;' +
        'align-items:center;justify-content:center;z-index:50;padding:20px';
      ov.innerHTML = '<div class="card" style="width:100%;max-width:340px">' +
        '<h2>Mật khẩu root</h2>' +
        '<div class="f" style="grid-template-columns:1fr"><input id="pwIn" type="password" ' +
        'style="width:100%;padding:10px;font-size:16px"></div>' +
        '<div class="actions"><button class="pri" id="pwOk" style="flex:1">Vào</button></div></div>';
      document.body.appendChild(ov);
      var inp = ov.querySelector('#pwIn');
      function done(ok) {
        try { document.body.removeChild(ov); } catch (e) {}
        resolve(ok);
      }
      function go() {
        var v = inp.value || '';
        if (!v) { done(false); return; }
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/adminpanel/api/login', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 15000;
        xhr.onload = function () {
          try {
            var j = JSON.parse(xhr.responseText);
            if (j && !j.error && j.ok !== false) { setPw(v); done(true); return; }
          } catch (e) {}
          msg('Sai mật khẩu', true);
          done(false);
        };
        xhr.onerror = function () { done(false); };
        xhr.ontimeout = function () { done(false); };
        xhr.send(JSON.stringify({ password: v, remember: true }));
      }
      ov.querySelector('#pwOk').onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 300);
    });
  }

  function groupOf(key) {
    for (var i = 0; i < catalog.length; i++) {
      if ((catalog[i].keys || []).indexOf(key) !== -1) return catalog[i];
    }
    return { id: 'other', title: 'Khác', hint: '' };
  }

  function enableOf(sec) {
    if (!isObj(sec)) return null;
    if (typeof sec.enable === 'boolean') return sec.enable;
    if (typeof sec.enabled === 'boolean') return sec.enabled;
    return null;
  }

  function load() {
    msg('Đang tải...');
    Promise.all([
      api('/adminpanel/api/current', 'GET'),
      api('/adminpanel/api/groups/catalog', 'GET')
    ]).then(function (res) {
      current = res[0] || {};
      catalog = res[1] || [];
      msg('');
      home('');
    }).catch(function (e) { msg('Lỗi tải: ' + e.message, true); });
  }

  function home(f) {
    f = (f || '').toLowerCase();
    curKey = '';
    var map = {};
    catalog.forEach(function (g) { (g.keys || []).forEach(function (k) { map[k] = 1; }); });
    Object.keys(current).forEach(function (k) { map[k] = 1; });
    var html = '';
    var groups = catalog.slice();
    groups.push({ id: 'other', title: 'Khác', hint: '', keys: [] });
    var seen = {};
    groups.forEach(function (g) {
      var keys = (g.keys || []).concat(
        g.id === 'other' ? Object.keys(map).filter(function (k) { return !seen[k]; }) : []
      );
      var tiles = '';
      keys.forEach(function (k) {
        seen[k] = 1;
        var sec = current[k];
        if (f && (k + ' ' + JSON.stringify(sec)).toLowerCase().indexOf(f) === -1) return;
        var en = enableOf(sec);
        var dot = en === null ? '' : (en ? '🟢' : '⚫');
        tiles += '<button class="tile" data-k="' + esc(k) + '"><span>' + esc(k) +
          '</span><span>' + dot + '</span></button>';
      });
      if (!tiles) return;
      html += '<details class="grp"' + (f ? ' open' : '') + '><summary><span>' + esc(g.title || g.id) +
        '</span><span class="hint">' + esc(g.hint || '') + '</span></summary>' +
        '<div class="tiles">' + tiles + '</div></details>';
    });
    $('main').innerHTML = html || '<div class="empty">Không khớp</div>';
    document.querySelectorAll('#main .tile').forEach(function (b) {
      b.onclick = function () { open(b.getAttribute('data-k')); };
    });
  }

  function inputFor(key, val) {
    var k = 'data-k="' + esc(key) + '"';
    if (typeof val === 'boolean') {
      return '<input ' + k + ' data-t="b" type="checkbox"' + (val ? ' checked' : '') + '>';
    }
    if (typeof val === 'number') {
      return '<input ' + k + ' data-t="n" type="number" step="any" value="' + esc(val) + '">';
    }
    if (typeof val === 'string') {
      if (val.length > 80 || val.indexOf('\n') !== -1) {
        return '<textarea ' + k + ' data-t="s" rows="3">' + esc(val) + '</textarea>';
      }
      return '<input ' + k + ' data-t="s" type="text" value="' + esc(val) + '">';
    }
    if (Array.isArray(val) && val.every(function (x) { return typeof x !== 'object'; })) {
      return '<textarea ' + k + ' data-t="a" rows="4">' + esc(val.join('\n')) + '</textarea>';
    }
    return '<textarea ' + k + ' data-t="j" rows="6">' + esc(JSON.stringify(val, null, 2)) + '</textarea>';
  }

  function open(key) {
    curKey = key;
    var sec = current[key];
    if (!isObj(sec)) {
      msg('Đang lấy mẫu ' + key + '...');
      api('/adminpanel/api/sitetpl/' + encodeURIComponent(key), 'GET').then(function (tpl) {
        if (tpl && typeof tpl === 'object' && Object.keys(tpl).length) {
          current[key] = tpl;
          renderCard(key, tpl, true);
          msg('');
        } else {
          renderScalar(key, sec);
          msg('');
        }
      }).catch(function (e) { msg('Lỗi: ' + e.message, true); });
      return;
    }
    renderCard(key, sec, false);
  }

  function renderScalar(key, sec) {
    $('main').innerHTML = '<button class="back" id="bBack">‹ Danh sách</button>' +
      '<div class="card"><h2>' + esc(key) + '</h2>' +
      '<div class="sub">Giá trị đơn</div><div><code>' + esc(JSON.stringify(sec)) + '</code></div></div>';
    $('bBack').onclick = function () { home($('q').value); };
  }

  function renderCard(key, sec, isNew) {
    var keys = Object.keys(sec);
    ['enable', 'enabled'].forEach(function (en) {
      if (typeof sec[en] === 'boolean') keys = [en].concat(keys.filter(function (k) { return k !== en; }));
    });
    var en = enableOf(sec);
    var g = groupOf(key);
    var html = '<button class="back" id="bBack">‹ Danh sách</button>' +
      '<div class="card"><h2>' + (en === null ? '' : (en ? '🟢 ' : '⚫ ')) + esc(key) + '</h2>' +
      '<div class="sub">' + esc(g.title || '') +
      (isNew ? ' · MỚI từ file yaml — lưu là ghim đè lên yaml' : ' · lưu chỉ ghi mục này') + '</div>';
    keys.forEach(function (k) {
      html += '<div class="f"><label>' + esc(k) + '</label>' + inputFor(k, sec[k]) + '</div>';
    });
    html += '<div class="actions"><button class="pri" id="bSave">Lưu</button>' +
      '<button id="bRe">Lưu + Restart</button></div></div>';
    html += '<div class="card"><h2>JSON thô</h2>' +
      '<div class="sub">Đúng đoạn init của mục này — sửa tay rồi lưu</div>' +
      '<div class="f" style="grid-template-columns:1fr"><textarea id="bJson" rows="14">' +
      esc(JSON.stringify(sec, null, 2)) + '</textarea></div>' +
      '<div class="actions"><button class="pri" id="bSaveJ">Lưu JSON</button></div></div>';
    $('main').innerHTML = html;
    $('bBack').onclick = function () { home($('q').value); };
    $('bSave').onclick = function () { save(key, false); };
    $('bRe').onclick = function () { save(key, true); };
    $('bSaveJ').onclick = function () {
      var out;
      try { out = JSON.parse($('bJson').value); }
      catch (e) { msg('JSON hỏng: ' + e.message, true); return; }
      msg('Đang lưu ' + key + '...');
      api('/adminpanel/api/init/section/' + encodeURIComponent(key), 'POST', out).then(function () {
        current[key] = out;
        renderCard(key, out, false);
        msg('Đã lưu ' + key + ' — nhớ Restart');
      }).catch(function (e) { msg('Lỗi: ' + e.message, true); });
    };
  }

  function collect() {
    var out = {};
    document.querySelectorAll('#main [data-k]').forEach(function (el) {
      var t = el.getAttribute('data-t'), k = el.getAttribute('data-k');
      if (t === 'b') out[k] = el.checked;
      else if (t === 'n') out[k] = el.value === '' ? 0 : Number(el.value);
      else if (t === 's') out[k] = el.value;
      else if (t === 'a') {
        out[k] = el.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; });
      }
      else out[k] = JSON.parse(el.value);
    });
    return out;
  }

  function save(key, restart) {
    var out;
    try { out = collect(); }
    catch (e) { msg('JSON hỏng: ' + e.message, true); return; }
    msg('Đang lưu ' + key + '...');
    api('/adminpanel/api/init/section/' + encodeURIComponent(key), 'POST', out).then(function () {
      current[key] = out;
      renderCard(key, out, false);
      if (!restart) { msg('Đã lưu ' + key + ' — nhớ Restart'); return; }
      msg('Đã lưu — đang restart...');
      return api('/adminpanel/api/restart', 'POST', {}).then(function () {
        msg('Đã restart — đợi 1 phút rồi dùng');
      });
    }).catch(function (e) { msg('Lỗi: ' + e.message, true); });
  }

  $('q').addEventListener('input', function (e) {
    if (!curKey) home(e.target.value);
  });
  $('btnRestart').addEventListener('click', function () {
    if (!confirm('Restart lampac? (mất ~1 phút)')) return;
    msg('Đang restart...');
    api('/adminpanel/api/restart', 'POST', {}).then(function () {
      msg('Đã restart — đợi 1 phút');
    }).catch(function (e) { msg('Lỗi: ' + e.message, true); });
  });

  if (IN_APP) {
    var bc = $('btnClose');
    bc.classList.remove('hide');
    bc.addEventListener('click', function () {
      try { window.parent.Lampa.Modal.close(); } catch (e) {}
    });
  }

  load();
})();
</script>
</body>
</html>
